<text x="285" y="578.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Credentials</text>
<rect x="435.0" y="515.0" width="210" height="100" rx="12" fill="white" stroke="#333" stroke-width="1.6"/>
<text x="540" y="551.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Fetch Assigned</text>
<text x="540" y="578.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Classes and Subjects</text>
<rect x="710.0" y="515.0" width="210" height="100" rx="12" fill="white" stroke="#333" stroke-width="1.6"/>
<text x="815" y="551.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Fetch Assessments</text>
<text x="815" y="578.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">for the Assignment</text>
<rect x="980.0" y="510.0" width="220" height="110" rx="12" fill="white" stroke="#333" stroke-width="1.6"/>
