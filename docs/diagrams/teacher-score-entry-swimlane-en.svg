<text x="2745" y="313.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Success Notification</text>
<polygon points="3070,235.0 3135.0,300 3070,365.0 3005.0,300" fill="white" stroke="#333" stroke-width="1.6"/>
