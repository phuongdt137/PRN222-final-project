<text x="815" y="313.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">and Subject</text>
<rect x="985.0" y="250.0" width="210" height="100" rx="12" fill="white" stroke="#333" stroke-width="1.6"/>
<text x="1090" y="286.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Select an</text>
<text x="1090" y="313.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Assessment</text>
<rect x="1260.0" y="245.0" width="220" height="110" rx="12" fill="white" stroke="#333" stroke-width="1.6"/>
<text x="1370" y="273.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Enter Scores and</text>
<text x="1370" y="300.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Comments for</text>
