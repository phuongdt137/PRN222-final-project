<text x="285" y="300.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Log in</text>
<rect x="435.0" y="250.0" width="210" height="100" rx="12" fill="white" stroke="#333" stroke-width="1.6"/>
<text x="540" y="286.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Open Assessment</text>
<text x="540" y="313.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Management</text>
