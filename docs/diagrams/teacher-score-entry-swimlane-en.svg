<text x="2440" y="551.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Save New Scores and</text>
<text x="2440" y="578.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#111">Lock Only Saved Rows</text>
<text x="1750.0" y="758.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Partial entry is allowed: blank scores are skipped. Only newly saved scores are locked; previously locked scores remain unchanged.</text>
<text x="1750.0" y="787.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Locks apply to individual students within the selected assessment. Students without a saved score remain editable. There is no draft step.</text>
