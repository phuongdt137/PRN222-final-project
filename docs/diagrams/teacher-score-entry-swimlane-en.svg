<text x="1340" y="434.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Show editable and</text>
<text x="1340" y="459.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">read-only rows</text>
