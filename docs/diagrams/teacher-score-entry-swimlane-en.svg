<polyline points="2135,500 2135,210 1510,210 1510,382 1370,382 1370,355" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="1900" y="192.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">No: show validation errors</text>
<polyline points="2200,565 2315,565" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="2256" y="545.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Yes</text>
<polyline points="2565,565 2595,565 2595,300 2630,300" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="2860,300 3005,300" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="3070,235 3070,125 1090,125 1090,250" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="2835" y="108.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Yes</text>
<polyline points="3135,300 3320,300" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="3220" y="280.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">No</text>
