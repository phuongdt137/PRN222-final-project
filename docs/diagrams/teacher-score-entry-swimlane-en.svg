<text transform="translate(80,257) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20">TEACHER</text>
<text transform="translate(80,577) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="20">SYSTEM</text>
<polyline points="170,300 195,300" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="285,350 285,515" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="349" y="435.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Authenticate</text>
<polyline points="375,565 400,565 400,300 435,300" fill="none" stroke="#222" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="450" y="390.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Signed in</text>
