<text x="1570.0" y="841.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#111">Entry / editing is allowed from the lesson start until before 00:00 the next day (Vietnam time), while the semester is active and the session is not cancelled. Changes after submission require a reason.</text>
